[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "future-stress"
version = "0.1.0"
description = "BC카드 결제 데이터와 장래인구로 상권의 미래 소비기반 위험을 진단하는 분석 파이프라인"
requires-python = ">=3.10"
dependencies = [
    "boto3",
    "pandas",
    "numpy",
    "scipy",
    "openpyxl",
    "psycopg[binary]",
    "pyarrow",
    "requests",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src 폴더를 import 경로에 추가해서, 설치하지 않아도 테스트가 future_stress를 찾을 수 있게 합니다.
pythonpath = ["src"]
testpaths = ["tests"]
# integration: 실제 객체 저장소(SeaweedFS)가 떠 있어야 도는 테스트. 없으면 건너뜁니다.
markers = ["integration: 실제 Docker 서비스(SeaweedFS · PostgreSQL)가 필요한 테스트. 없으면 건너뜀"]
