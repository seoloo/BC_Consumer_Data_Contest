[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "future-stress"
version = "0.1.0"
description = "BC카드 결제 데이터와 장래인구로 상권의 미래 소비기반 위험을 진단하는 분석 파이프라인"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "openpyxl",
    "requests",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# src 폴더를 import 경로에 추가해서, 설치하지 않아도 테스트가 future_stress를 찾을 수 있게 합니다.
pythonpath = ["src"]
testpaths = ["tests"]
