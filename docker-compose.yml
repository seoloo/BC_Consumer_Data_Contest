# 이 프로젝트를 돌리는 데 필요한 로컬 서비스.
#   object-store  Bronze 원본을 보관하는 S3 호환 객체 저장소(SeaweedFS)   기록: docs/notes/14_object_storage.md
#   warehouse     raw · silver · gold 스키마를 둘 데이터 웨어하우스(PostgreSQL)  기록: docs/notes/15_postgresql.md
#   dbt           raw → silver → gold SQL 모델 · 테스트 (필요할 때만 실행)        기록: docs/notes/16_dbt.md
#   airflow       월 배치 작업 흐름(DAG) · 화면 127.0.0.1:58280 (필요할 때만 띄움)  기록: docs/notes/18_airflow.md
#
# dbt 실행 (up으로는 뜨지 않고 run으로만):  docker compose run --rm dbt build
# Airflow 띄우기 (메모리를 많이 써서 따로):  docker compose --profile airflow up -d
#
# 처음 한 번 (저장소 루트에서, PowerShell은 한 줄씩)
#   .venv\Scripts\python -m future_stress.local_env               # .env에 로컬 전용 계정 만들기 (S3 · PostgreSQL)
#   docker compose up -d                                           # 저장소 띄우기
#   docker compose ps                                              # STATUS가 healthy인지 확인
#
# 끄기: docker compose down   (데이터는 볼륨에 남음, 지우려면 docker compose down -v)

name: bc-consumer-data

services:
  object-store:
    # MinIO는 2025-10 무료판 이미지 배포를 멈추고 2026-09 Docker Hub에서 이미지가 지워져,
    # 같은 S3 API를 쓰는 SeaweedFS로 정했습니다. 언제 띄워도 같은 환경이 되도록 버전을 고정합니다.
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?먼저 python -m future_stress.local_env 를 실행해 주세요}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?먼저 python -m future_stress.local_env 를 실행해 주세요}
    # 시작할 때 환경변수로 S3 계정 설정 파일을 만든 뒤, master · volume · filer · S3를 한 컨테이너로 띄웁니다.
    # 키를 이미지나 이 파일에 적지 않고 .env에서만 받기 위해서입니다.
    # 볼륨 수는 디스크 여유에 맞춰 자동(-volume.max=0), 볼륨 하나는 256MB로 작게 둡니다
    # (기본 상한이면 버킷을 여러 개 만들 때 쓰기가 실패할 수 있음).
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        printf '{"identities":[{"name":"pipeline","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}'
        "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY" > /tmp/s3.json &&
        exec weed server -dir=/data -volume.max=0 -master.volumeSizeLimitMB=256
        -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    ports:
      # 이 PC에서만 접속 가능(127.0.0.1). 다른 프로젝트가 쓰는 59000번과 겹치지 않게 59100번을 씁니다.
      - "127.0.0.1:${S3_PORT:-59100}:8333"
    volumes:
      - object-store-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  warehouse:
    # 이 PC에 이미 받아 둔 버전으로 고정합니다. 다른 프로젝트도 같은 이미지를 쓰지만 컨테이너 · 볼륨 · 포트는 따로입니다.
    image: postgres:16.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?먼저 python -m future_stress.local_env 를 실행해 주세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?먼저 python -m future_stress.local_env 를 실행해 주세요}
      POSTGRES_DB: ${POSTGRES_DB:-future_stress}
    ports:
      # 이 PC에서만 접속 가능. 다른 프로젝트가 쓰는 55432번과 겹치지 않게 55532번을 씁니다.
      - "127.0.0.1:${POSTGRES_PORT:-55532}:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  dbt:
    # dbt가 Python 3.14를 아직 지원하지 않을 수 있어, PC에 Python을 더 설치하지 않고 공식 이미지로 돌립니다 (버전 고정).
    image: ghcr.io/dbt-labs/dbt-postgres:1.9.0
    # profiles에 넣으면 'docker compose up'으로는 뜨지 않고, 'docker compose run --rm dbt ...'로만 실행됩니다.
    # dbt는 계속 떠 있는 서버가 아니라 한 번 돌고 끝나는 명령이기 때문입니다.
    profiles: ["tools"]
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?먼저 python -m future_stress.local_env 를 실행해 주세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?먼저 python -m future_stress.local_env 를 실행해 주세요}
      POSTGRES_DB: ${POSTGRES_DB:-future_stress}
      POSTGRES_HOST: warehouse          # 컨테이너끼리는 서비스 이름으로 접속
      DBT_PROFILES_DIR: /usr/app/dbt    # 저장소의 dbt/profiles.yml (비밀번호는 위 환경변수에서)
    volumes:
      - ./dbt:/usr/app/dbt
    working_dir: /usr/app/dbt

  airflow:
    # 이 PC에 있는 공식 이미지(3.1.7) 위에 프로젝트 의존성 + dbt 1.9.0을 얹은 이미지 (docker/airflow/Dockerfile)
    build: ./docker/airflow
    image: bc-consumer-data-airflow:3.1.7
    # 메모리를 많이 써서(약 1GB) 평소 'docker compose up'으로는 뜨지 않게 합니다.
    profiles: ["airflow"]
    depends_on:
      warehouse:
        condition: service_healthy
      object-store:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?먼저 python -m future_stress.local_env 를 실행해 주세요}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?먼저 python -m future_stress.local_env 를 실행해 주세요}
      POSTGRES_DB: ${POSTGRES_DB:-future_stress}
      # 컨테이너 안에서는 127.0.0.1이 아니라 서비스 이름으로 접속합니다 (warehouse.py · object_store.py가 읽음)
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      POSTGRES_HOST: warehouse                       # dbt/profiles.yml
      # dbt 실행 결과(target) · 기록(logs)은 Airflow 자기 폴더에. 저장소의 dbt/target · dbt/logs는 dbt 컨테이너(root)가
      # 만든 폴더라 Airflow 사용자(uid 50000)가 쓸 수 없고, 두 컨테이너가 같은 폴더를 함께 쓰면 서로 덮어쓸 수 있어서입니다.
      DBT_TARGET_PATH: /opt/airflow/dbt-target
      DBT_LOG_PATH: /opt/airflow/logs/dbt
      S3_ENDPOINT_URL: http://object-store:8333
      # Airflow 기록용 DB는 같은 PostgreSQL 안의 별도 데이터베이스 'airflow' (create_metadata_db.py가 만듦)
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@warehouse:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_FOLDER: /opt/project/airflow/dags
      AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Seoul
      # 이 PC(127.0.0.1)에서만 열리는 개발용이라 로그인 없이 모두 관리자로 봅니다. 공개 서버라면 끄고 계정을 둬야 함
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "True"
      # 공식 이미지는 명령을 실행하기 '전에' 기록용 DB 접속부터 확인하는데, 그 DB는 아래 명령(create_metadata_db.py)이
      # 만들기 때문에 처음 띄울 때는 확인이 실패합니다. 확인을 끄고 스크립트가 DB를 만든 뒤 Airflow가 뜨게 합니다.
      CONNECTION_CHECK_MAX_COUNT: "0"
    # standalone: 스케줄러 · 화면(API 서버) · DAG 읽기를 한 컨테이너에서. 운영용은 아니지만 이 PC 메모리에 맞춤
    command: ["bash", "-c", "python /opt/project/docker/airflow/create_metadata_db.py && exec airflow standalone"]
    ports:
      - "127.0.0.1:58280:8080"     # 다른 프로젝트의 Airflow(8080, 58080)와 겹치지 않게
    volumes:
      - .:/opt/project             # 코드 · dbt · data 폴더를 그대로 연결 (고치면 바로 반영)
      - airflow-logs:/opt/airflow/logs
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/v2/monitor/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  object-store-data:
  warehouse-data:
  airflow-logs:
