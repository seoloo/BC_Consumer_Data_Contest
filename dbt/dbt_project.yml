# dbt 프로젝트 설정 · Phase 3 (기록: docs/notes/16_dbt.md)
#
# 실행 (저장소 루트에서, docker compose up -d 뒤)
#   docker compose run --rm dbt build          # seed → 모델 → 테스트를 순서대로
#   docker compose run --rm dbt build --vars "{raw_schema: raw_synthetic}" --target synthetic   # 합성 데이터
#
# 층과 스키마
#   raw     파이썬(warehouse.py)이 원본을 표기 그대로 넣은 곳. dbt는 읽기만 합니다 (models/sources.yml)
#   ref     코드 · 이름 기준표 (seeds/*.csv)
#   silver  거르기 · 코드 → 이름 · 표준화 (models/silver/)
#   gold    연령별 소비구조 · 프로필 · Future Stress · 4유형 (models/gold/)

name: future_stress
version: "0.1.0"
config-version: 2
profile: future_stress

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "logs"]

vars:
  # raw 스키마 이름. 합성 데이터는 raw_synthetic (warehouse.py가 나눠 넣음)
  raw_schema: raw
  # 기준연도와 비교연도 (src/future_stress/config.py와 같은 값)
  base_year: 2026
  target_years: [2030, 2035, 2040]
  # Future Stress를 계산하는 연도, 분석 기간, 판정 기준 (config.py의 STRESS_YEARS · ANALYSIS_LENGTH · MIN_RISING_MONTHS · SIZE_TOP_PERCENT)
  stress_years: [2035, 2040]
  # 분석 기간 = raw 결제의 마지막 달에서 거꾸로 이 개월 수 (macros/analysis_window.sql). 손으로 정하려면 --vars로 analysis_months를 넘김
  analysis_length: 6
  # 원본 제공처가 결제 10건 이하 칸을 빼고 제공함. 새 원본도 지키는지 검사 (config.MIN_CARD_PAYMENT_COUNT)
  min_card_payment_count: 11
  min_rising_months: 3
  size_top_percent: 25

seeds:
  future_stress:
    +schema: ref
    +persist_docs: {relation: true, columns: true}

# persist_docs: schema.yml의 표 · 열 설명을 PostgreSQL에도 COMMENT로 저장 → DB만 봐도 뜻을 알 수 있고,
# python -m future_stress.warehouse_docs 가 이 설명으로 데이터 사전을 만듭니다.

models:
  future_stress:
    +persist_docs: {relation: true, columns: true}
    silver:
      +schema: silver
      +materialized: table
    gold:
      +schema: gold
      +materialized: table
