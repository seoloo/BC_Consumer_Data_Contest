# Streamlit 설정 (저장소 루트에서 streamlit run 할 때 읽음)
# 이 PC 안에서만 열리게 127.0.0.1에 묶고, 다른 서비스(58280 Airflow · 55532 PostgreSQL)와 겹치지 않는 포트를 씁니다.
[server]
address = "127.0.0.1"
port = 58501
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"   # 오른쪽 위 Deploy 버튼 숨김 (이 화면은 배포하지 않음)
